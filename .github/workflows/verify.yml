# Continuous verification: re-run the whole ledger offline on the committed snapshots, run the tests,
# and compare with the on-chain record (read-only RPC, no keys). A red run means the repo and the contract disagree.
name: verify
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ledger all --offline
      - run: python -m ledger test
      - run: python -m ledger verify
