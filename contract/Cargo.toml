[package]
name = "evidence-ledger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Evidence Ledger registry: on-chain, re-checkable verdicts, challenges and scored forecasts for investment-thesis claims"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
